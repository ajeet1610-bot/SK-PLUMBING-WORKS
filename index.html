<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Plumbing Works | Premium Engineering & Pipeline Solutions Mumbai</title>
    <!-- Bootstrap 5 Pro CSS CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Google Fonts Framework -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome Pro Icons -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        :root {
            --primary-brand: #0052cc;
            --secondary-brand: #ff6a00;
            --dark-navy: #0a1128;
            --slate-gray: #4a5568;
            --ice-bg: #f4f7fc;
        }
        body {
            font-family: 'Poppins', sans-serif;
            color: #1e293b;
            background-color: #ffffff;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, .navbar-brand {
            font-family: 'Montserrat', sans-serif;
        }
        /* Enterprise Top Utility Ribbon */
        .top-utility-ribbon {
            background-color: var(--dark-navy);
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
            padding: 10px 0;
            font-weight: 500;
            border-bottom: 2px solid rgba(255,255,255,0.05);
        }
        /* Navigation Corporate Menu */
        .navbar {
            padding: 20px 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .navbar-brand {
            font-weight: 800;
            font-size: 1.7rem;
            letter-spacing: -0.5px;
            color: var(--primary-brand) !important;
        }
        .navbar-brand span {
            color: var(--secondary-brand);
        }
        .nav-link {
            font-weight: 600;
            color: #334155 !important;
            padding: 8px 16px !important;
            transition: all 0.3s;
        }
        .nav-link:hover {
            color: var(--primary-brand) !important;
        }
        /* Dynamic Sliding Pictures Carousel (Hero) */
        .carousel-item {
            height: 600px;
            min-height: 400px;
            background: no-repeat center center/cover;
        }
        .carousel-item::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(135deg, rgba(10,17,40,0.9) 30%, rgba(0,82,204,0.4) 100%);
        }
        .carousel-caption {
            bottom: 25%;
            z-index: 10;
            text-align: left;
            max-width: 700px;
        }
        .carousel-caption h1 {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.15;
            margin-bottom: 20px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .carousel-caption p {
            font-size: 1.3rem;
            opacity: 0.95;
            margin-bottom: 35px;
            font-weight: 300;
        }
        .btn-premium-cta {
            background: linear-gradient(135deg, var(--secondary-brand), #e05300);
            color: white !important;
            font-weight: 700;
            padding: 15px 35px;
            border-radius: 6px;
            border: none;
            box-shadow: 0 5px 15px rgba(255,106,0,0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }
        .btn-premium-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,106,0,0.4);
        }
        /* Dynamic Counter Stats */
        .stats-ribbon {
            background-color: var(--primary-brand);
            color: white;
            padding: 40px 0;
            margin-top: -30px;
            position: relative;
            z-index: 20;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,82,204,0.25);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            color: var(--secondary-brand);
        }
        /* Pro Operations Section */
        .section-layout {
            padding: 100px 0;
        }
        .section-headline {
            text-align: center;
            margin-bottom: 60px;
        }
        .section-headline h2 {
            font-weight: 800;
            font-size: 2.5rem;
            color: var(--dark-navy);
            position: relative;
            display: inline-block;
            padding-bottom: 20px;
        }
        .section-headline h2::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 5px;
            background: linear-gradient(to right, var(--primary-brand), var(--secondary-brand));
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
        }
        /* Premium Service Layout Cards */
        .pro-card {
            background: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 45px 35px;
            box-shadow: 0 10px 40px rgba(10,17,40,0.03);
            border: 1px solid #f1f5f9;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
            height: 100%;
        }
        .pro-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--primary-brand);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }
        .pro-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,82,204,0.08);
            border-color: rgba(0,82,204,0.1);
        }
        .pro-card:hover::before {
            transform: scaleX(1);
        }
        .pro-icon-frame {
            width: 80px;
            height: 80px;
            background: rgba(0,82,204,0.05);
            color: var(--primary-brand);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 30px;
            transition: 0.3s;
        }
        .pro-card:hover .pro-icon-frame {
            background: var(--primary-brand);
            color: white;
            transform: rotateY(180deg);
        }
        .estimation-tag {
            background-color: #e2effe;
            color: var(--primary-brand);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 6px 16px;
            border-radius: 50px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }
        /* Lead Management Block */
        .management-banner {
            background-color: var(--ice-bg);
            border-radius: 20px;
            padding: 60px;
            border: 1px solid #e2e8f0;
        }
        .mgr-badge {
            background: #ffffff;
            border-left: 4px solid var(--secondary-brand);
            padding: 20px;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        /* Contact Channel Blocks */
        .contact-channel-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            border: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .btn-channel-call {
            background-color: var(--ice-bg);
            border: 1px solid #cbd5e1;
            color: var(--primary-brand);
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-channel-call:hover {
            background-color: var(--primary-brand);
            color: white;
        }
        .btn-channel-wa {
            background-color: #25D366;
            color: white;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(37,211,102,0.2);
            transition: 0.3s;
        }
        .btn-channel-wa:hover {
            background-color: #1fba54;
            color: white;
        }
        /* Floating Sticky Widget */
        .floating-sticky-wa {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25D366;
            color: white !important;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(37,211,102,0.4);
            text-decoration: none;
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
            transition: all 0.3s;
        }
        .floating-sticky-wa:hover {
            transform: scale(1.05);
            background-color: #1fa34a;
        }
        /* Corporate Dark Footer */
        footer {
            background-color: var(--dark-navy);
            color: rgba(255,255,255,0.65);
            padding: 80px 0 30px 0;
            font-size: 0.95rem;
            border-top: 5px solid var(--primary-brand);
        }
        footer h4 {
